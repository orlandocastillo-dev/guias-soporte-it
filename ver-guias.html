<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Manual técnico: papel gris claro, texto muy legible (Atkinson Hyperlegible), código en JetBrains Mono
     y un naranja de señal solo para lo que hay que mirar primero. */
  :root {
    --paper: #eef0f2; --sheet: #ffffff; --ink: #15181c; --muted: #555d68; --line: #d5d9df; --line-soft: #e5e8ec;
    --signal: #c2410c; --signal-wash: #fff3ec; --link: #1f4fb8; --code-bg: #f1f3f5;
    --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 var(--sans); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .9rem; height: 52px; padding: 0 1.25rem;
    background: var(--ink); color: #fff; font: 600 .8rem var(--mono); letter-spacing: .04em; }
  .bar__tag { padding: .15rem .45rem; border: 1px solid #fff; border-radius: 3px; font-size: .72rem; }
  .bar__tag--signal { border-color: var(--signal); background: var(--signal); }
  .bar__right { margin-left: auto; color: #9aa3ae; font-weight: 400; }
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 52px); }
  nav { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; padding: 1.5rem 1.25rem 2rem; border-right: 1px solid var(--line); background: var(--sheet); }
  nav h1 { margin: 0 0 1.5rem; font-size: 1.15rem; line-height: 1.25; }
  nav h1 small { display: block; margin-top: .3rem; color: var(--muted); font: 400 .75rem var(--mono); letter-spacing: .03em; }
  nav h2 { margin: 1.5rem 0 .4rem; color: var(--muted); font: 600 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .links { counter-reset: guia; }
  nav a { display: flex; gap: .6rem; padding: .4rem .5rem; border-left: 2px solid transparent; color: var(--ink); text-decoration: none; font-size: .92rem; line-height: 1.35; }
  nav a::before { counter-increment: guia; content: counter(guia, decimal-leading-zero); flex: none; color: var(--muted); font: 400 .75rem/1.9 var(--mono); }
  nav a:hover { background: var(--paper); }
  nav a[aria-current="page"] { border-left-color: var(--signal); background: var(--signal-wash); font-weight: 700; }
  nav a[aria-current="page"]::before { color: var(--signal); }
  main { min-width: 0; padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 5vw, 4rem) 5rem; }
  article { max-width: 820px; counter-reset: paso; }
  article h1 { margin: 0 0 1rem; font-size: clamp(1.9rem, 3.6vw, 2.6rem); line-height: 1.12; letter-spacing: -.015em; }
  article h2 { counter-increment: paso; margin: 2.75rem 0 .75rem; padding-top: 1rem; border-top: 2px solid var(--ink); font-size: 1.35rem; line-height: 1.25; }
  article h2::before { content: counter(paso, decimal-leading-zero); display: block; margin-bottom: .2rem; color: var(--signal); font: 600 .78rem var(--mono); letter-spacing: .06em; }
  article h3 { margin-top: 1.75rem; font-size: 1.08rem; }
  a { color: var(--link); text-underline-offset: 3px; }
  table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1.25rem 0; background: var(--sheet); font-size: .92rem; }
  th { padding: .55rem .8rem; background: var(--ink); color: #fff; font: 600 .78rem var(--mono); letter-spacing: .03em; text-align: left; white-space: nowrap; }
  td { padding: .55rem .8rem; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
  /* Las fichas de las guías usan una cabecera vacía: se oculta. */
  thead:has(th:empty:first-child) { display: none; }
  code { padding: .1em .35em; border-radius: 3px; background: var(--code-bg); font: .86em var(--mono); }
  pre { overflow-x: auto; padding: 1rem 1.1rem; border-left: 3px solid var(--signal); border-radius: 0 6px 6px 0; background: #15181c; color: #e7eaee; font-size: .85rem; line-height: 1.55; }
  pre code { padding: 0; background: none; color: inherit; }
  blockquote { margin: 1.25rem 0; padding: .75rem 1rem; border: 1px solid #f5c7ad; border-left: 4px solid var(--signal); background: var(--signal-wash); color: var(--ink); }
  blockquote p { margin: 0; }
  li.check { list-style: none; margin-left: -1.3rem; }
  li { margin: .2rem 0; }
  .mermaid { margin: 1.5rem 0; padding: 1rem; border: 1px solid var(--line); background: var(--sheet); text-align: center; overflow-x: auto; }
  .menu-btn { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav .links { display: none; }
    nav.open .links { display: block; }
    .menu-btn { display: block; width: 100%; padding: .65rem; border: 1px solid var(--ink); border-radius: 4px; background: none; color: var(--ink); font: 600 .9rem var(--sans); }
    .bar__right { display: none; }
    main { padding: 1.5rem 1rem 3rem; }
  }
  @media print { nav, .bar { display: none; } .layout { display: block; } }
</style>

<script>
  const PAGINAS = [{"id": "inicio", "titulo": "Inicio", "grupo": "", "html": "<h1>Documentación de soporte técnico (IT Support)<\/h1>\n<p>Guías de solución de problemas para usuarios de Windows en un entorno de oficina o centro de contacto. Están escritas para que otro técnico de primer nivel pueda seguirlas sin ayuda y para que el caso quede bien registrado en el ticket.<\/p>\n<h2>Cómo verlas<\/h2>\n<ul>\n<li><strong>En tu computador:<\/strong> abre <code>ver-guias.html<\/code> con doble clic. Es un visor con todas las guías, los diagramas y los scripts, sin instalar nada.<\/li>\n<li><strong>En GitHub:<\/strong> los archivos <code>.md<\/code> se ven formateados directamente en el repositorio.<\/li>\n<li><strong>En VS Code:<\/strong> abre cualquier <code>.md<\/code> y presiona <code>Ctrl + Shift + V<\/code> para ver la vista previa.<\/li>\n<\/ul>\n<p>Si editas una guía, regenera el visor con <code>pip install markdown<\/code> y luego <code>python generar-visor.py<\/code>.<\/p>\n<h2>Guías<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Problema<\/th>\n<th>Categoría<\/th>\n<th>Tiempo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td><a href=\"#01-conectado-sin-internet\">Wi-Fi o cable \"Conectado, sin internet\"<\/a><\/td>\n<td>Red<\/td>\n<td>10 a 20 min<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td><a href=\"#02-equipo-lento-disco-al-100\">Equipo lento al iniciar y disco al 100 %<\/a><\/td>\n<td>Rendimiento / hardware<\/td>\n<td>30 a 60 min<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td><a href=\"#03-impresora-cola-atascada\">La impresora no imprime: cola atascada<\/a><\/td>\n<td>Periféricos<\/td>\n<td>5 a 15 min<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td><a href=\"#04-diadema-sin-microfono-softphone\">Diadema sin micrófono en el softphone<\/a><\/td>\n<td>Audio / telefonía<\/td>\n<td>5 a 15 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Scripts de apoyo (PowerShell)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Script<\/th>\n<th>Para qué sirve<\/th>\n<th>Administrador<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"#diagnostico-red\"><code>diagnostico-red.ps1<\/code><\/a><\/td>\n<td>Revisa IP, puerta de enlace, DNS, salida a internet y proxy. Guarda un informe en el escritorio para adjuntarlo al ticket. Con <code>-Reparar<\/code> vacía la caché DNS y renueva la IP.<\/td>\n<td>Solo con <code>-Reparar<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"#limpiar-cola-impresion\"><code>limpiar-cola-impresion.ps1<\/code><\/a><\/td>\n<td>Detiene el Spooler, borra los trabajos atascados y lo vuelve a iniciar.<\/td>\n<td>Sí<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#info-equipo\"><code>info-equipo.ps1<\/code><\/a><\/td>\n<td>Ficha técnica del equipo (modelo, serie, SO, RAM, discos con su salud, red) con avisos automáticos. Exporta a JSON o CSV.<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Para ejecutarlos en un equipo con la política de ejecución restringida, sin cambiarla de forma permanente:<\/p>\n<pre><code class=\"language-powershell\">powershell -ExecutionPolicy Bypass -File .\\scripts\\diagnostico-red.ps1\n<\/code><\/pre>\n<h2>Cómo están escritas<\/h2>\n<p>Todas las guías siguen la misma <a href=\"#plantilla-guia\">plantilla<\/a>, pensada para el trabajo real de una mesa de ayuda:<\/p>\n<ol>\n<li><strong>Ficha inicial:<\/strong> a qué aplica, nivel de soporte, tiempo estimado, riesgo y permisos necesarios. El técnico sabe antes de empezar si puede hacerlo él o debe escalar.<\/li>\n<li><strong>Síntoma<\/strong> descrito como lo reporta el usuario, no como lo nombraría un técnico.<\/li>\n<li><strong>Causas más comunes<\/strong>, de la más probable a la menos probable.<\/li>\n<li><strong>Diagrama de diagnóstico<\/strong> para descartar primero lo que no es del equipo (la red, la impresora, la diadema) antes de tocar la configuración.<\/li>\n<li><strong>Pasos numerados<\/strong> con el comando exacto y el resultado esperado.<\/li>\n<li><strong>Lista de verificación<\/strong> para confirmar con el usuario antes de cerrar.<\/li>\n<li><strong>Criterio de escalamiento<\/strong> con la información que necesita el siguiente nivel.<\/li>\n<li><strong>Nota para el ticket<\/strong> lista para copiar, con síntoma, diagnóstico, acciones y resultado.<\/li>\n<\/ol>\n<p>Los diagramas usan <a href=\"https://mermaid.js.org/\">Mermaid<\/a>, que GitHub muestra como imagen directamente.<\/p>\n<h2>Capturas de pantalla<\/h2>\n<p>Cada guía indica qué captura va en cada paso (<code>Captura sugerida: capturas/...<\/code>). La lista completa con los nombres de archivo está en <a href=\"capturas/README.md\"><code>capturas/README.md<\/code><\/a>.<\/p>\n<h2>Buenas prácticas que aplico<\/h2>\n<ul>\n<li><strong>Preguntar antes de tocar.<\/strong> \"¿A tus compañeros les pasa?\" ahorra la mitad de los diagnósticos.<\/li>\n<li><strong>Un cambio a la vez<\/strong> y probar después de cada uno, para saber qué lo arregló.<\/li>\n<li><strong>Avisar antes de cualquier paso con impacto<\/strong> (reinicios, trabajos de impresión que se pierden).<\/li>\n<li><strong>El usuario confirma el cierre<\/strong>, no el técnico.<\/li>\n<li><strong>Documentar aunque se haya resuelto rápido.<\/strong> Los casos repetidos son los que justifican un cambio de fondo (una IP fija para la impresora, un SSD para el equipo lento).<\/li>\n<\/ul>\n<hr />\n<p>Orlando Castillo, estudiante de Ingeniería de Sistemas.<\/p>"}, {"id": "01-conectado-sin-internet", "titulo": "Wi-Fi o cable \"Conectado, sin internet\" en Windows", "grupo": "Guías", "html": "<h1>Wi-Fi o cable \"Conectado, sin internet\" en Windows<\/h1>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aplica a<\/strong><\/td>\n<td>Windows 10 y 11, conexión por Wi-Fi o cable<\/td>\n<\/tr>\n<tr>\n<td><strong>Nivel<\/strong><\/td>\n<td>Soporte de primer nivel (N1)<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiempo estimado<\/strong><\/td>\n<td>10 a 20 minutos<\/td>\n<\/tr>\n<tr>\n<td><strong>Riesgo<\/strong><\/td>\n<td>Bajo. El paso 6 reinicia la configuración de red y pide reiniciar el equipo<\/td>\n<\/tr>\n<tr>\n<td><strong>Requiere<\/strong><\/td>\n<td>Permisos de administrador desde el paso 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Síntoma<\/h2>\n<p>El ícono de red muestra un globo o un triángulo amarillo y Windows indica <strong>\"Conectado, sin internet\"<\/strong> o <strong>\"Sin acceso a Internet\"<\/strong>. El equipo está conectado a la red local, pero no abre páginas web, Teams ni el correo.<\/p>\n<h2>Causas más comunes<\/h2>\n<ol>\n<li>El problema no es del equipo: el router, el proveedor o el proxy de la empresa están fallando.<\/li>\n<li>El equipo no recibió una dirección IP válida por DHCP (aparece una IP <code>169.254.x.x<\/code>).<\/li>\n<li>La caché de DNS tiene registros dañados o el servidor DNS no responde.<\/li>\n<li>La pila TCP/IP o el catálogo Winsock quedaron dañados (por ejemplo, después de desinstalar una VPN o un antivirus).<\/li>\n<li>El controlador del adaptador de red está desactualizado o en estado de error.<\/li>\n<\/ol>\n<h2>Diagnóstico rápido<\/h2>\n<p>La idea es descartar de afuera hacia adentro: primero la red, luego la configuración del equipo, al final el controlador.<\/p>\n<div class=\"mermaid\">flowchart TD\n    A[Sin internet] --&gt; B{¿Otros equipos en la misma red&lt;br/&gt;tienen internet?}\n    B -- No --&gt; C[Falla de red o del proveedor.&lt;br/&gt;Escalar a redes]\n    B -- Sí --&gt; D{ipconfig: ¿la IP empieza&lt;br/&gt;por 169.254?}\n    D -- Sí --&gt; E[Sin DHCP: renovar IP, paso 3]\n    D -- No --&gt; F{ping 8.8.8.8 responde?}\n    F -- No --&gt; G[Revisar puerta de enlace&lt;br/&gt;y adaptador, pasos 5 y 6]\n    F -- Sí --&gt; H{ping google.com responde?}\n    H -- No --&gt; I[Problema de DNS: paso 4]\n    H -- Sí --&gt; J[Revisar proxy y navegador, paso 7]\n<\/div>\n\n<h2>Solución paso a paso<\/h2>\n<h3>1. Confirmar el alcance<\/h3>\n<p>Preguntar al usuario si otros compañeros en el mismo piso o la misma red tienen internet. Si nadie tiene, <strong>no tocar el equipo<\/strong>: el problema es de la red y se escala (ver al final).<\/p>\n<blockquote>\n<p>Captura sugerida: <code>capturas/01-icono-red.png<\/code>, ícono de red con el aviso \"Sin internet\".<\/p>\n<\/blockquote>\n<h3>2. Revisar la configuración IP<\/h3>\n<p>Abrir <strong>Símbolo del sistema<\/strong> (Inicio, escribir <code>cmd<\/code>, Enter) y ejecutar:<\/p>\n<pre><code class=\"language-cmd\">ipconfig /all\n<\/code><\/pre>\n<p>Fijarse en el adaptador que está en uso (Wi-Fi o Ethernet):<\/p>\n<table>\n<thead>\n<tr>\n<th>Campo<\/th>\n<th>Valor esperado<\/th>\n<th>Si no<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dirección IPv4<\/td>\n<td>De la red de la empresa, por ejemplo <code>192.168.1.45<\/code><\/td>\n<td><code>169.254.x.x<\/code> significa que no hubo respuesta de DHCP<\/td>\n<\/tr>\n<tr>\n<td>Puerta de enlace<\/td>\n<td>Una IP, por ejemplo <code>192.168.1.1<\/code><\/td>\n<td>Vacía: el equipo no sabe por dónde salir<\/td>\n<\/tr>\n<tr>\n<td>Servidores DNS<\/td>\n<td>Una o dos IP<\/td>\n<td>Vacío o una IP extraña: revisar paso 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Captura sugerida: <code>capturas/01-ipconfig.png<\/code>, resultado de <code>ipconfig /all<\/code> con los tres campos resaltados.<\/p>\n<\/blockquote>\n<p>Probar la conectividad en orden:<\/p>\n<pre><code class=\"language-cmd\">ping 192.168.1.1\nping 8.8.8.8\nping google.com\n<\/code><\/pre>\n<p>En orden: la puerta de enlace que mostró <code>ipconfig<\/code> (cambiarla por la real), un servidor en internet por IP y un dominio, que además prueba el DNS.<\/p>\n<ul>\n<li>Si falla la puerta de enlace: problema entre el equipo y el router (cable, Wi-Fi, adaptador).<\/li>\n<li>Si responde <code>8.8.8.8<\/code> pero no <code>google.com<\/code>: el problema es DNS.<\/li>\n<\/ul>\n<h3>3. Renovar la dirección IP<\/h3>\n<pre><code class=\"language-cmd\">ipconfig /release\nipconfig /renew\n<\/code><\/pre>\n<p>Si después de renovar sigue apareciendo <code>169.254.x.x<\/code>, el servidor DHCP no está respondiendo a este equipo: probar con cable si estaba por Wi-Fi, y si persiste, escalar.<\/p>\n<h3>4. Limpiar la caché de DNS<\/h3>\n<p>Abrir <code>cmd<\/code> <strong>como administrador<\/strong> (clic derecho, \"Ejecutar como administrador\"):<\/p>\n<pre><code class=\"language-cmd\">ipconfig /flushdns\n<\/code><\/pre>\n<p>Debe responder <em>\"Se vació correctamente la caché de resolución de DNS\"<\/em>. Volver a probar <code>ping google.com<\/code>.<\/p>\n<h3>5. Reiniciar el adaptador de red<\/h3>\n<ol>\n<li><code>Win + R<\/code>, escribir <code>ncpa.cpl<\/code> y Enter.<\/li>\n<li>Clic derecho sobre el adaptador en uso, <strong>Deshabilitar<\/strong>.<\/li>\n<li>Esperar 10 segundos, clic derecho, <strong>Habilitar<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>Captura sugerida: <code>capturas/01-ncpa.png<\/code>, ventana de conexiones de red con el menú contextual abierto.<\/p>\n<\/blockquote>\n<h3>6. Restablecer Winsock y TCP/IP<\/h3>\n<p>Solo si los pasos anteriores no funcionaron. En <code>cmd<\/code> como administrador:<\/p>\n<pre><code class=\"language-cmd\">netsh winsock reset\nnetsh int ip reset\n<\/code><\/pre>\n<p><strong>Reiniciar el equipo<\/strong> para que el cambio tenga efecto. Si el usuario tenía una IP fija configurada a mano, anotarla antes, porque este paso la borra.<\/p>\n<p>Alternativa gráfica en Windows 10 y 11: <strong>Configuración &gt; Red e Internet &gt; Configuración de red avanzada &gt; Restablecimiento de red<\/strong>.<\/p>\n<h3>7. Revisar proxy<\/h3>\n<p>Si hay ping a <code>google.com<\/code> pero el navegador no carga:<\/p>\n<ol>\n<li><strong>Configuración &gt; Red e Internet &gt; Proxy<\/strong>.<\/li>\n<li>Verificar que \"Detectar la configuración automáticamente\" coincida con la política de la empresa y que no haya un proxy manual que nadie reconoce.<\/li>\n<\/ol>\n<h3>8. Actualizar o reinstalar el controlador<\/h3>\n<ol>\n<li>Clic derecho en Inicio, <strong>Administrador de dispositivos<\/strong>.<\/li>\n<li>Expandir <strong>Adaptadores de red<\/strong>. Un triángulo amarillo indica error.<\/li>\n<li>Clic derecho, <strong>Desinstalar el dispositivo<\/strong> (sin marcar \"eliminar el software del controlador\") y reiniciar. Windows lo vuelve a instalar.<\/li>\n<\/ol>\n<h2>Verificación<\/h2>\n<ul>\n<li class=\"check\"><input type=\"checkbox\"> <code>ipconfig<\/code> muestra una IP de la red de la empresa, puerta de enlace y DNS.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> <code>ping google.com<\/code> responde sin pérdida de paquetes.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> El usuario abre un sitio web y su aplicación de trabajo (correo, Teams, sistema interno).<\/li>\n<li class=\"check\"><input type=\"checkbox\"> El ícono de red ya no muestra advertencia.<\/li>\n<\/ul>\n<h2>Si no se resuelve<\/h2>\n<p>Escalar a <strong>redes (N2)<\/strong> con esta información:<\/p>\n<ul>\n<li>Nombre del equipo (<code>hostname<\/code>) y usuario.<\/li>\n<li>Resultado completo de <code>ipconfig /all<\/code> y de los tres <code>ping<\/code>.<\/li>\n<li>Si el problema es solo en una ubicación (por ejemplo, una sala) o en todas.<\/li>\n<li>Pasos ya realizados de esta guía.<\/li>\n<\/ul>\n<h2>Script de apoyo<\/h2>\n<p><a href=\"#diagnostico-red\"><code>scripts/diagnostico-red.ps1<\/code><\/a> ejecuta las pruebas de los pasos 2 a 4 y guarda un informe en el escritorio para adjuntarlo al ticket.<\/p>\n<h2>Nota para el ticket<\/h2>\n<pre><code class=\"language-text\">Síntoma: &quot;Conectado, sin internet&quot; en Wi-Fi.\nDiagnóstico: IP 169.254.x.x, sin respuesta DHCP. Otros equipos de la sala con internet.\nAcciones: ipconfig /release y /renew sin éxito; reinicio de adaptador; netsh winsock reset + reinicio.\nResultado: IP 192.168.1.87 asignada, navegación normal. Usuario confirma.\nEstado: Cerrado.\n<\/code><\/pre>"}, {"id": "02-equipo-lento-disco-al-100", "titulo": "Equipo lento al iniciar y disco al 100 %", "grupo": "Guías", "html": "<h1>Equipo lento al iniciar y disco al 100 %<\/h1>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aplica a<\/strong><\/td>\n<td>Windows 10 y 11<\/td>\n<\/tr>\n<tr>\n<td><strong>Nivel<\/strong><\/td>\n<td>N1, con paso a N2 si hay falla de hardware<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiempo estimado<\/strong><\/td>\n<td>30 a 60 minutos (SFC y DISM tardan)<\/td>\n<\/tr>\n<tr>\n<td><strong>Riesgo<\/strong><\/td>\n<td>Bajo. No se borran archivos del usuario<\/td>\n<\/tr>\n<tr>\n<td><strong>Requiere<\/strong><\/td>\n<td>Permisos de administrador<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Síntoma<\/h2>\n<p>El equipo tarda varios minutos en mostrar el escritorio, las aplicaciones se congelan y en el <strong>Administrador de tareas<\/strong> la columna <strong>Disco<\/strong> aparece en 100 % aunque el usuario no esté haciendo nada.<\/p>\n<h2>Causas más comunes<\/h2>\n<ol>\n<li>Demasiados programas configurados para arrancar con Windows.<\/li>\n<li>Poco espacio libre en la unidad C: (menos del 10 %).<\/li>\n<li>Actualizaciones de Windows o análisis del antivirus ejecutándose en segundo plano.<\/li>\n<li>Archivos del sistema dañados.<\/li>\n<li><strong>Disco mecánico (HDD) envejecido o con sectores dañados.<\/strong> Es la causa de fondo más frecuente en equipos de más de cuatro años.<\/li>\n<\/ol>\n<h2>Diagnóstico<\/h2>\n<div class=\"mermaid\">flowchart TD\n    A[Equipo lento] --&gt; B[Administrador de tareas:&lt;br/&gt;¿qué proceso usa el disco?]\n    B --&gt; C{¿Es un proceso&lt;br/&gt;temporal conocido?}\n    C -- Windows Update / antivirus --&gt; D[Esperar a que termine&lt;br/&gt;y verificar de nuevo]\n    C -- No --&gt; E[Revisar inicio, espacio&lt;br/&gt;y archivos del sistema]\n    E --&gt; F{¿Sigue lento?}\n    F -- Sí --&gt; G[Revisar salud del disco]\n    G --&gt; H{¿Es HDD o tiene&lt;br/&gt;errores SMART?}\n    H -- Sí --&gt; I[Escalar: cambio a SSD]\n<\/div>\n\n<h3>Identificar el proceso responsable<\/h3>\n<ol>\n<li><code>Ctrl + Shift + Esc<\/code> para abrir el <strong>Administrador de tareas<\/strong>.<\/li>\n<li>Pestaña <strong>Procesos<\/strong>, clic en la columna <strong>Disco<\/strong> para ordenar de mayor a menor.<\/li>\n<li>Anotar los tres procesos con más uso.<\/li>\n<\/ol>\n<blockquote>\n<p>Captura sugerida: <code>capturas/02-administrador-tareas.png<\/code>, procesos ordenados por uso de disco.<\/p>\n<\/blockquote>\n<p>Para más detalle: pestaña <strong>Rendimiento<\/strong>, <strong>Abrir Monitor de recursos<\/strong>, pestaña <strong>Disco<\/strong>. Ahí se ve qué archivos está leyendo o escribiendo cada proceso.<\/p>\n<table>\n<thead>\n<tr>\n<th>Proceso<\/th>\n<th>Qué es<\/th>\n<th>Acción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Antimalware Service Executable<\/code><\/td>\n<td>Análisis de Microsoft Defender<\/td>\n<td>Esperar o programar el análisis fuera del horario laboral<\/td>\n<\/tr>\n<tr>\n<td><code>Windows Modules Installer Worker<\/code> / <code>wuauserv<\/code><\/td>\n<td>Windows Update<\/td>\n<td>Dejar terminar y reiniciar<\/td>\n<\/tr>\n<tr>\n<td><code>SearchIndexer<\/code><\/td>\n<td>Indexación de búsqueda<\/td>\n<td>Normal tras una actualización; si es constante, reconstruir el índice<\/td>\n<\/tr>\n<tr>\n<td><code>SysMain<\/code><\/td>\n<td>Precarga de aplicaciones<\/td>\n<td>En HDD lentos puede empeorar el problema<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Solución paso a paso<\/h2>\n<h3>1. Reducir los programas de inicio<\/h3>\n<ol>\n<li>Administrador de tareas, pestaña <strong>Aplicaciones de inicio<\/strong> (en Windows 10: <strong>Inicio<\/strong>).<\/li>\n<li>Revisar la columna <strong>Impacto de inicio<\/strong>.<\/li>\n<li><strong>Deshabilitar<\/strong> lo que no sea necesario al arrancar: actualizadores, clientes de juegos, reproductores, utilidades de impresoras.<\/li>\n<li>No deshabilitar el antivirus, la VPN corporativa ni los controladores de audio y video.<\/li>\n<\/ol>\n<blockquote>\n<p>Captura sugerida: <code>capturas/02-inicio.png<\/code>, lista de aplicaciones de inicio con impacto alto.<\/p>\n<\/blockquote>\n<h3>2. Liberar espacio en disco<\/h3>\n<ol>\n<li><strong>Configuración &gt; Sistema &gt; Almacenamiento<\/strong>.<\/li>\n<li>Entrar a <strong>Archivos temporales<\/strong> y eliminar: archivos temporales, caché de Windows Update, Papelera (confirmar con el usuario).<\/li>\n<li>Activar <strong>Sensor de almacenamiento<\/strong> para que se haga automáticamente.<\/li>\n<\/ol>\n<p>Meta: dejar al menos <strong>15 % libre<\/strong> en la unidad C:.<\/p>\n<h3>3. Reparar archivos del sistema<\/h3>\n<p>En <strong>Terminal<\/strong> o <code>cmd<\/code> como administrador, en este orden:<\/p>\n<pre><code class=\"language-cmd\">DISM /Online /Cleanup-Image /RestoreHealth\nsfc /scannow\n<\/code><\/pre>\n<ul>\n<li>DISM repara la imagen de Windows que usa SFC como referencia; por eso va primero.<\/li>\n<li>Cada uno puede tardar entre 10 y 30 minutos. No cerrar la ventana.<\/li>\n<li>Resultado esperado de SFC: <em>\"Protección de recursos de Windows encontró archivos dañados y los reparó correctamente\"<\/em> o <em>\"no encontró ninguna infracción de integridad\"<\/em>.<\/li>\n<\/ul>\n<h3>4. Revisar la salud del disco<\/h3>\n<p>En <strong>PowerShell<\/strong> como administrador:<\/p>\n<pre><code class=\"language-powershell\">Get-PhysicalDisk | Select-Object FriendlyName, MediaType, HealthStatus, OperationalStatus, Size\n<\/code><\/pre>\n<ul>\n<li><code>MediaType<\/code> = <strong>HDD<\/strong> en un equipo de oficina moderno es, por sí solo, motivo suficiente para recomendar el cambio a SSD.<\/li>\n<li><code>HealthStatus<\/code> distinto de <strong>Healthy<\/strong>: el disco está fallando. Respaldar los datos del usuario <strong>antes de cualquier otra acción<\/strong> y escalar.<\/li>\n<\/ul>\n<p>Revisar también el <strong>Visor de eventos<\/strong> (<code>eventvwr.msc<\/code>) en <strong>Registros de Windows &gt; Sistema<\/strong>, filtrando por los orígenes <code>disk<\/code> y <code>Ntfs<\/code>. Errores repetidos como <em>\"Se detectó un bloque defectuoso\"<\/em> confirman falla física.<\/p>\n<blockquote>\n<p>Captura sugerida: <code>capturas/02-get-physicaldisk.png<\/code>.<\/p>\n<\/blockquote>\n<h3>5. Ajustes para equipos con HDD (mientras llega el cambio)<\/h3>\n<pre><code class=\"language-powershell\"># Desactiva la precarga de aplicaciones, que en discos mecánicos compite con el uso normal\nStop-Service -Name SysMain -Force\nSet-Service -Name SysMain -StartupType Disabled\n<\/code><\/pre>\n<p>Revertir con <code>Set-Service -Name SysMain -StartupType Automatic<\/code> cuando el equipo tenga SSD.<\/p>\n<h2>Verificación<\/h2>\n<ul>\n<li class=\"check\"><input type=\"checkbox\"> El escritorio aparece en menos de 2 minutos desde el encendido.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> Con el equipo en reposo, el uso de disco baja de 10 % después de 5 minutos.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> Hay al menos 15 % de espacio libre.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> SFC terminó sin errores pendientes.<\/li>\n<\/ul>\n<h2>Si no se resuelve<\/h2>\n<p>Escalar a <strong>soporte de hardware (N2)<\/strong> con:<\/p>\n<ul>\n<li>Modelo del equipo y antigüedad aproximada.<\/li>\n<li>Resultado de <code>Get-PhysicalDisk<\/code> y errores del Visor de eventos.<\/li>\n<li>Recomendación: reemplazo de HDD por SSD y clonación del disco.<\/li>\n<\/ul>\n<h2>Nota para el ticket<\/h2>\n<pre><code class=\"language-text\">Síntoma: inicio de ~10 min, disco al 100 % en reposo.\nDiagnóstico: 14 programas en inicio, 4 GB libres de 238 GB, HDD de 5 años en buen estado SMART.\nAcciones: deshabilitados 9 programas de inicio, limpieza de 31 GB, DISM + SFC sin errores, SysMain deshabilitado.\nResultado: inicio en 1 min 40 s, disco en reposo al 3 %. Se recomienda cambio a SSD.\nEstado: Cerrado. Se abre solicitud de hardware.\n<\/code><\/pre>"}, {"id": "03-impresora-cola-atascada", "titulo": "La impresora no imprime: trabajos atascados en la cola", "grupo": "Guías", "html": "<h1>La impresora no imprime: trabajos atascados en la cola<\/h1>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aplica a<\/strong><\/td>\n<td>Windows 10 y 11, impresoras locales (USB) y de red<\/td>\n<\/tr>\n<tr>\n<td><strong>Nivel<\/strong><\/td>\n<td>N1<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiempo estimado<\/strong><\/td>\n<td>5 a 15 minutos<\/td>\n<\/tr>\n<tr>\n<td><strong>Riesgo<\/strong><\/td>\n<td>Bajo. Se pierden los trabajos que estaban en cola: avisar al usuario<\/td>\n<\/tr>\n<tr>\n<td><strong>Requiere<\/strong><\/td>\n<td>Permisos de administrador para los pasos 3 y 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Síntoma<\/h2>\n<p>El usuario envía un documento a imprimir y no sale. En la cola de impresión el trabajo aparece como <strong>\"Error\"<\/strong>, <strong>\"Imprimiendo\"<\/strong> sin avanzar o <strong>\"Eliminando\"<\/strong> sin desaparecer. Los documentos nuevos se quedan detrás del primero.<\/p>\n<h2>Causas más comunes<\/h2>\n<ol>\n<li>Un trabajo dañado bloquea la cola y el servicio <strong>Cola de impresión<\/strong> (<code>Spooler<\/code>) no puede liberarlo.<\/li>\n<li>La impresora está desconectada, sin papel, sin tóner o con un atasco físico.<\/li>\n<li>La impresora de red cambió de dirección IP y el puerto configurado en Windows ya no apunta a ella.<\/li>\n<li>El controlador está dañado o no corresponde al modelo.<\/li>\n<\/ol>\n<h2>Diagnóstico<\/h2>\n<div class=\"mermaid\">flowchart TD\n    A[No imprime] --&gt; B{¿La impresora muestra&lt;br/&gt;error en su panel?}\n    B -- Sí --&gt; C[Papel, tóner o atasco:&lt;br/&gt;resolver en la impresora]\n    B -- No --&gt; D{¿Otros usuarios&lt;br/&gt;pueden imprimir?}\n    D -- No --&gt; E{¿Responde a ping?}\n    E -- No --&gt; F[Impresora sin red:&lt;br/&gt;revisar cable o IP]\n    D -- Sí --&gt; G[Problema en este equipo:&lt;br/&gt;limpiar la cola, pasos 2 a 4]\n    G --&gt; H{¿Sigue sin imprimir?}\n    H -- Sí --&gt; I[Revisar puerto y controlador,&lt;br/&gt;pasos 5 y 6]\n<\/div>\n\n<p>Antes de tocar el equipo:<\/p>\n<ul>\n<li>Mirar el panel de la impresora: papel, tóner, puertas abiertas, mensajes de atasco.<\/li>\n<li>Preguntar si otros usuarios pueden imprimir en la misma impresora. Si <strong>nadie<\/strong> puede, el problema está en la impresora o en el servidor de impresión, no en este equipo.<\/li>\n<li>Para impresoras de red, probar conectividad con su IP (está en la etiqueta o en el menú de red de la impresora):<\/li>\n<\/ul>\n<pre><code class=\"language-cmd\">ping 192.168.1.50\n<\/code><\/pre>\n<h2>Solución paso a paso<\/h2>\n<h3>1. Cancelar desde la interfaz<\/h3>\n<p><strong>Configuración &gt; Bluetooth y dispositivos &gt; Impresoras y escáneres<\/strong>, elegir la impresora, <strong>Abrir cola de impresión<\/strong>, menú <strong>Impresora &gt; Cancelar todos los documentos<\/strong>.<\/p>\n<p>Si los trabajos desaparecen, probar imprimir de nuevo. Si se quedan en \"Eliminando\", seguir con el paso 2.<\/p>\n<blockquote>\n<p>Captura sugerida: <code>capturas/03-cola.png<\/code>, cola con un trabajo en estado de error.<\/p>\n<\/blockquote>\n<h3>2. Detener el servicio de cola de impresión<\/h3>\n<p>En <code>cmd<\/code> como administrador:<\/p>\n<pre><code class=\"language-cmd\">net stop spooler\n<\/code><\/pre>\n<p>Resultado esperado: <em>\"El servicio de Cola de impresión se detuvo correctamente\"<\/em>.<\/p>\n<h3>3. Borrar los trabajos pendientes<\/h3>\n<pre><code class=\"language-cmd\">del /Q /F %systemroot%\\System32\\spool\\PRINTERS\\*.*\n<\/code><\/pre>\n<p>Esa carpeta solo contiene los archivos temporales de los trabajos en cola; no se borran controladores ni configuraciones.<\/p>\n<h3>4. Iniciar de nuevo el servicio<\/h3>\n<pre><code class=\"language-cmd\">net start spooler\n<\/code><\/pre>\n<blockquote>\n<p>Captura sugerida: <code>capturas/03-spooler.png<\/code>, resultado de detener e iniciar el servicio.<\/p>\n<\/blockquote>\n<p>Abrir la cola: debe estar vacía. Imprimir una <strong>página de prueba<\/strong> (Propiedades de la impresora, <strong>Imprimir página de prueba<\/strong>).<\/p>\n<blockquote>\n<p>Los pasos 2 a 4 están automatizados en <a href=\"#limpiar-cola-impresion\"><code>scripts/limpiar-cola-impresion.ps1<\/code><\/a>.<\/p>\n<\/blockquote>\n<h3>5. Verificar el puerto (impresoras de red)<\/h3>\n<ol>\n<li><strong>Propiedades de la impresora<\/strong>, pestaña <strong>Puertos<\/strong>.<\/li>\n<li>Comprobar que el puerto marcado tenga la <strong>IP actual<\/strong> de la impresora.<\/li>\n<li>Si la IP cambió: <strong>Agregar puerto &gt; Standard TCP/IP Port<\/strong>, escribir la nueva IP y seleccionarlo.<\/li>\n<\/ol>\n<p>Recomendar a redes reservar una IP fija para la impresora en el DHCP para que no vuelva a pasar.<\/p>\n<h3>6. Reinstalar el controlador<\/h3>\n<ol>\n<li>Quitar la impresora desde <strong>Impresoras y escáneres<\/strong>.<\/li>\n<li>Ejecutar <code>printui /s /t2<\/code> como administrador, pestaña <strong>Controladores<\/strong>, eliminar el controlador del modelo.<\/li>\n<li>Descargar el controlador desde la página del fabricante y agregar la impresora de nuevo.<\/li>\n<\/ol>\n<h2>Verificación<\/h2>\n<ul>\n<li class=\"check\"><input type=\"checkbox\"> La cola de impresión está vacía.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> La página de prueba sale completa.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> El usuario imprime el documento original desde su aplicación.<\/li>\n<\/ul>\n<h2>Si no se resuelve<\/h2>\n<p>Escalar a <strong>N2 / servidor de impresión<\/strong> con:<\/p>\n<ul>\n<li>Nombre y modelo de la impresora, IP y si es compartida desde un servidor.<\/li>\n<li>Resultado del <code>ping<\/code> y estado del servicio (<code>sc query spooler<\/code>).<\/li>\n<li>Mensaje exacto del error en la cola o en el Visor de eventos (<strong>Aplicaciones y servicios &gt; Microsoft &gt; Windows &gt; PrintService<\/strong>).<\/li>\n<\/ul>\n<h2>Prevención<\/h2>\n<ul>\n<li>Reservar IP fija para cada impresora de red.<\/li>\n<li>Instalar impresoras desde un servidor de impresión con controladores homologados.<\/li>\n<li>Evitar enviar archivos PDF muy pesados o escaneados a resolución máxima a impresoras con poca memoria.<\/li>\n<\/ul>\n<h2>Nota para el ticket<\/h2>\n<pre><code class=\"language-text\">Síntoma: trabajos en cola con estado &quot;Error&quot;, la impresora del 2.° piso no imprime desde este equipo.\nDiagnóstico: otros usuarios imprimen bien; ping a la impresora correcto; trabajo dañado bloqueando la cola.\nAcciones: net stop spooler, borrado de C:\\Windows\\System32\\spool\\PRINTERS, net start spooler.\nResultado: página de prueba correcta, usuario imprime su documento.\nEstado: Cerrado.\n<\/code><\/pre>"}, {"id": "04-diadema-sin-microfono-softphone", "titulo": "Diadema sin micrófono o sin audio en el softphone", "grupo": "Guías", "html": "<h1>Diadema sin micrófono o sin audio en el softphone<\/h1>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aplica a<\/strong><\/td>\n<td>Windows 10 y 11, diademas USB o de conector 3,5 mm, softphones y Teams / Zoom<\/td>\n<\/tr>\n<tr>\n<td><strong>Nivel<\/strong><\/td>\n<td>N1<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiempo estimado<\/strong><\/td>\n<td>5 a 15 minutos<\/td>\n<\/tr>\n<tr>\n<td><strong>Riesgo<\/strong><\/td>\n<td>Bajo<\/td>\n<\/tr>\n<tr>\n<td><strong>Contexto<\/strong><\/td>\n<td>Incidencia muy frecuente en centros de contacto: un agente sin micrófono deja de atender llamadas, así que se trata como prioridad alta<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Síntoma<\/h2>\n<p>El agente escucha al cliente pero <strong>el cliente no lo escucha<\/strong> (o al revés). La diadema funciona en otro equipo o en el celular. A veces el problema empezó después de desconectar y conectar la diadema o de una actualización de Windows.<\/p>\n<h2>Causas más comunes<\/h2>\n<ol>\n<li>Windows tiene seleccionado <strong>otro dispositivo<\/strong> como entrada o salida predeterminada (el micrófono de la cámara web, los parlantes del monitor).<\/li>\n<li>El softphone tiene configurado su propio dispositivo, distinto al de Windows.<\/li>\n<li>La <strong>privacidad del micrófono<\/strong> está bloqueando el acceso a las aplicaciones de escritorio.<\/li>\n<li>El micrófono está silenciado desde el botón físico de la diadema o desde el control de volumen.<\/li>\n<li>Puerto USB defectuoso o diadema dañada.<\/li>\n<\/ol>\n<h2>Diagnóstico<\/h2>\n<div class=\"mermaid\">flowchart TD\n    A[No se escucha al agente] --&gt; B{¿El botón de silencio&lt;br/&gt;de la diadema está activo?}\n    B -- Sí --&gt; C[Desactivarlo y probar]\n    B -- No --&gt; D{¿Windows detecta la voz?&lt;br/&gt;Barra de nivel en Sonido}\n    D -- No --&gt; E{¿Aparece la diadema&lt;br/&gt;en dispositivos de entrada?}\n    E -- No --&gt; F[Cambiar de puerto USB&lt;br/&gt;y revisar controlador]\n    E -- Sí --&gt; G[Seleccionarla como predeterminada&lt;br/&gt;y revisar privacidad]\n    D -- Sí --&gt; H[El problema es del softphone:&lt;br/&gt;revisar su configuración de audio]\n<\/div>\n\n<h2>Solución paso a paso<\/h2>\n<h3>1. Revisar lo físico<\/h3>\n<ul>\n<li>Botón de silencio en el cable o en el auricular (suele tener una luz roja cuando está activo).<\/li>\n<li>Brazo del micrófono bajado cerca de la boca: algunos modelos se silencian al subirlo.<\/li>\n<li>Para diademas de 3,5 mm: confirmar que el conector del micrófono (rosado) esté en la entrada de micrófono y no en la de audífonos.<\/li>\n<li>Probar otro puerto USB, preferiblemente uno directo del equipo y no de un hub o del monitor.<\/li>\n<\/ul>\n<h3>2. Elegir la diadema como dispositivo predeterminado<\/h3>\n<ol>\n<li><code>Win + R<\/code>, escribir <code>mmsys.cpl<\/code> y Enter.<\/li>\n<li>Pestaña <strong>Grabación<\/strong>: hablar en la diadema y verificar que <strong>la barra verde se mueva<\/strong> junto a ella.<\/li>\n<li>Clic derecho sobre la diadema, <strong>Establecer como dispositivo predeterminado<\/strong> y también <strong>Establecer como dispositivo de comunicación predeterminado<\/strong>.<\/li>\n<li>Repetir en la pestaña <strong>Reproducción<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p>Captura sugerida: <code>capturas/04-mmsys-grabacion.png<\/code>, pestaña Grabación con la barra de nivel activa.<\/p>\n<\/blockquote>\n<p>En <strong>Propiedades<\/strong> del micrófono, pestaña <strong>Niveles<\/strong>, confirmar que el volumen no esté en 0 ni silenciado.<\/p>\n<h3>3. Revisar la privacidad del micrófono<\/h3>\n<p><strong>Configuración &gt; Privacidad y seguridad &gt; Micrófono<\/strong>:<\/p>\n<ul>\n<li><strong>Acceso al micrófono<\/strong>: activado.<\/li>\n<li><strong>Permitir que las aplicaciones accedan al micrófono<\/strong>: activado.<\/li>\n<li><strong>Permitir que las aplicaciones de escritorio accedan al micrófono<\/strong>: activado. Este último es el que afecta a la mayoría de softphones, que no son aplicaciones de la Tienda.<\/li>\n<\/ul>\n<blockquote>\n<p>Captura sugerida: <code>capturas/04-privacidad.png<\/code>.<\/p>\n<\/blockquote>\n<h3>4. Configurar el audio dentro del softphone<\/h3>\n<p>Cada softphone (y Teams, Zoom, Webex) puede tener su propio dispositivo elegido, ignorando el predeterminado de Windows. En la configuración de audio de la aplicación:<\/p>\n<ul>\n<li><strong>Micrófono / Entrada<\/strong>: la diadema por su nombre, no \"Predeterminado\" si hay varias opciones.<\/li>\n<li><strong>Altavoz / Salida<\/strong>: la diadema.<\/li>\n<li>Usar la <strong>llamada de prueba<\/strong> o el medidor de nivel de la aplicación si lo tiene.<\/li>\n<\/ul>\n<p>Cerrar y volver a abrir el softphone después de cambiar dispositivos: varios solo leen la lista al iniciar.<\/p>\n<h3>5. Desactivar mejoras de audio y modo exclusivo<\/h3>\n<p>Si se escucha entrecortado o con eco:<\/p>\n<ol>\n<li><code>mmsys.cpl<\/code>, <strong>Grabación<\/strong>, <strong>Propiedades<\/strong> de la diadema.<\/li>\n<li>Pestaña <strong>Avanzado<\/strong>: desmarcar <strong>Permitir que las aplicaciones tomen control exclusivo de este dispositivo<\/strong>.<\/li>\n<li>Pestaña <strong>Mejoras<\/strong> (si existe): desactivar todas.<\/li>\n<\/ol>\n<h3>6. Reinstalar el controlador<\/h3>\n<ol>\n<li><strong>Administrador de dispositivos &gt; Entradas y salidas de audio<\/strong>.<\/li>\n<li>Clic derecho sobre la diadema, <strong>Desinstalar el dispositivo<\/strong>.<\/li>\n<li>Desconectar la diadema, reiniciar, volver a conectarla.<\/li>\n<\/ol>\n<h2>Verificación<\/h2>\n<ul>\n<li class=\"check\"><input type=\"checkbox\"> La barra de nivel se mueve al hablar en la pestaña Grabación.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> Llamada de prueba del softphone: el agente se escucha con claridad.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> El agente hace o recibe una llamada real y el cliente lo escucha.<\/li>\n<\/ul>\n<h2>Si no se resuelve<\/h2>\n<ul>\n<li>Probar la diadema en otro equipo y otra diadema en este equipo. Así se sabe si falla la diadema o el puesto.<\/li>\n<li>Si falla la diadema: <strong>cambio de periférico<\/strong> según el procedimiento de inventario.<\/li>\n<li>Si falla el puesto: escalar a <strong>N2<\/strong> con el modelo de la diadema, la versión del softphone y los pasos realizados.<\/li>\n<\/ul>\n<h2>Nota para el ticket<\/h2>\n<pre><code class=\"language-text\">Síntoma: clientes no escuchan al agente en el softphone. La diadema funciona en el celular.\nDiagnóstico: Windows tenía como entrada predeterminada el micrófono de la cámara web; el softphone usaba &quot;Predeterminado&quot;.\nAcciones: diadema establecida como dispositivo predeterminado y de comunicación; seleccionada explícitamente en el softphone.\nResultado: llamada de prueba correcta, agente vuelve a disponible.\nEstado: Cerrado. Tiempo fuera de línea del agente: 12 min.\n<\/code><\/pre>"}, {"id": "diagnostico-red", "titulo": "diagnostico-red.ps1", "grupo": "Scripts", "html": "<h1>diagnostico-red.ps1<\/h1><p>Script de PowerShell. Para ejecutarlo: <code>powershell -ExecutionPolicy Bypass -File .\\scripts\\diagnostico-red.ps1<\/code><\/p><pre><code>&lt;#\n.SYNOPSIS\n    Diagnóstico básico de red para adjuntar a un ticket de soporte.\n\n.DESCRIPTION\n    Revisa adaptadores activos, configuración IP, puerta de enlace, DNS y salida a internet.\n    Muestra un resumen en pantalla y guarda un informe de texto en el escritorio del usuario.\n    No modifica ninguna configuración.\n\n.PARAMETER Reparar\n    Si se indica, además vacía la caché DNS y renueva la IP (requiere administrador).\n\n.EXAMPLE\n    .\\diagnostico-red.ps1\n    .\\diagnostico-red.ps1 -Reparar\n\n.NOTES\n    Compatible con Windows 10 y 11, PowerShell 5.1 o superior.\n#&gt;\n[CmdletBinding()]\nparam(\n    [switch]$Reparar\n)\n\n$ErrorActionPreference = &#x27;Continue&#x27;\n$fecha   = Get-Date -Format &#x27;yyyy-MM-dd_HHmm&#x27;\n$informe = Join-Path ([Environment]::GetFolderPath(&#x27;Desktop&#x27;)) &quot;diagnostico-red_$env:COMPUTERNAME`_$fecha.txt&quot;\n$lineas  = [System.Collections.Generic.List[string]]::new()\n\nfunction Escribir {\n    param([string]$Texto, [ConsoleColor]$Color = &#x27;Gray&#x27;)\n    Write-Host $Texto -ForegroundColor $Color\n    $lineas.Add($Texto)\n}\n\nfunction Resultado {\n    param([string]$Prueba, [bool]$Ok, [string]$Detalle = &#x27;&#x27;)\n    $estado = if ($Ok) { &#x27;OK   &#x27; } else { &#x27;FALLA&#x27; }\n    $color  = if ($Ok) { &#x27;Green&#x27; } else { &#x27;Red&#x27; }\n    Escribir (&quot;[{0}] {1} {2}&quot; -f $estado, $Prueba.PadRight(32), $Detalle) $color\n}\n\nEscribir &quot;Diagnóstico de red: $env:COMPUTERNAME ($env:USERNAME), $(Get-Date -Format &#x27;dd/MM/yyyy HH:mm&#x27;)&quot; &#x27;Cyan&#x27;\nEscribir (&#x27;-&#x27; * 72)\n\n# 1. Adaptadores conectados -------------------------------------------------\n$adaptadores = Get-NetAdapter | Where-Object Status -eq &#x27;Up&#x27;\nResultado &#x27;Adaptador de red conectado&#x27; ($adaptadores.Count -gt 0) (($adaptadores.Name) -join &#x27;, &#x27;)\n\nif (-not $adaptadores) {\n    Escribir &#x27;No hay adaptadores conectados. Revisar cable, Wi-Fi o modo avión.&#x27; &#x27;Yellow&#x27;\n}\n\n# 2. Configuración IP -------------------------------------------------------\n$config = Get-NetIPConfiguration | Where-Object { $_.NetAdapter.Status -eq &#x27;Up&#x27; -and $_.IPv4Address } | Select-Object -First 1\n\nif ($config) {\n    $ip      = $config.IPv4Address.IPAddress\n    $gateway = $config.IPv4DefaultGateway.NextHop\n    $dns     = ($config.DNSServer | Where-Object AddressFamily -eq 2).ServerAddresses\n\n    Resultado &#x27;Dirección IP válida (no APIPA)&#x27; (-not $ip.StartsWith(&#x27;169.254&#x27;)) $ip\n    Resultado &#x27;Puerta de enlace configurada&#x27; ([bool]$gateway) $gateway\n    Resultado &#x27;Servidores DNS configurados&#x27; ($dns.Count -gt 0) ($dns -join &#x27;, &#x27;)\n} else {\n    Resultado &#x27;Configuración IPv4&#x27; $false &#x27;Sin dirección IPv4&#x27;\n}\n\n# 3. Conectividad -----------------------------------------------------------\nif ($gateway) {\n    $okGw = Test-Connection -ComputerName $gateway -Count 2 -Quiet\n    Resultado &#x27;Responde la puerta de enlace&#x27; $okGw $gateway\n}\n\n$okIp = Test-Connection -ComputerName &#x27;8.8.8.8&#x27; -Count 2 -Quiet\nResultado &#x27;Salida a internet por IP&#x27; $okIp &#x27;8.8.8.8&#x27;\n\ntry {\n    $resuelto = Resolve-DnsName -Name &#x27;www.microsoft.com&#x27; -Type A -ErrorAction Stop | Where-Object Type -eq &#x27;A&#x27; | Select-Object -First 1\n    Resultado &#x27;Resolución DNS&#x27; $true &quot;www.microsoft.com -&gt; $($resuelto.IPAddress)&quot;\n} catch {\n    Resultado &#x27;Resolución DNS&#x27; $false $_.Exception.Message\n}\n\n$https = Test-NetConnection -ComputerName &#x27;www.microsoft.com&#x27; -Port 443 -WarningAction SilentlyContinue\nResultado &#x27;Conexión HTTPS (puerto 443)&#x27; $https.TcpTestSucceeded\n\n# 4. Proxy ------------------------------------------------------------------\n$proxy = Get-ItemProperty &#x27;HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings&#x27; -ErrorAction SilentlyContinue\nif ($proxy.ProxyEnable -eq 1) {\n    Escribir &quot;Aviso: hay un proxy manual configurado ($($proxy.ProxyServer)).&quot; &#x27;Yellow&#x27;\n}\n\n# 5. Reparación opcional ----------------------------------------------------\nif ($Reparar) {\n    $esAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(\n        [Security.Principal.WindowsBuiltInRole]::Administrator)\n\n    if (-not $esAdmin) {\n        Escribir &#x27;Para -Reparar abre PowerShell como administrador.&#x27; &#x27;Yellow&#x27;\n    } else {\n        Escribir &#x27;&#x27;\n        Escribir &#x27;Aplicando reparación: vaciar caché DNS y renovar IP...&#x27; &#x27;Cyan&#x27;\n        Clear-DnsClientCache\n        ipconfig /release | Out-Null\n        ipconfig /renew   | Out-Null\n        Escribir &#x27;Listo. Vuelve a ejecutar el script sin -Reparar para verificar.&#x27; &#x27;Cyan&#x27;\n    }\n}\n\n# 6. Informe ----------------------------------------------------------------\nEscribir (&#x27;-&#x27; * 72)\n$lineas.Add(&#x27;&#x27;)\n$lineas.Add(&#x27;=== ipconfig /all ===&#x27;)\n$lineas.AddRange([string[]](ipconfig /all))\n$lineas | Out-File -FilePath $informe -Encoding utf8\n\nWrite-Host &quot;Informe guardado en: $informe&quot; -ForegroundColor Cyan\n<\/code><\/pre>"}, {"id": "info-equipo", "titulo": "info-equipo.ps1", "grupo": "Scripts", "html": "<h1>info-equipo.ps1<\/h1><p>Script de PowerShell. Para ejecutarlo: <code>powershell -ExecutionPolicy Bypass -File .\\scripts\\info-equipo.ps1<\/code><\/p><pre><code>&lt;#\n.SYNOPSIS\n    Ficha técnica del equipo para documentar un ticket o un inventario.\n\n.DESCRIPTION\n    Reúne en una sola vista los datos que casi siempre se piden al escalar un caso:\n    nombre, usuario, modelo, número de serie, sistema operativo, último reinicio,\n    procesador, memoria, discos (tipo, salud y espacio libre) y red.\n    Puede exportar el resultado a JSON o CSV para un inventario.\n\n.PARAMETER Exportar\n    Ruta de un archivo .json o .csv donde guardar la ficha.\n\n.EXAMPLE\n    .\\info-equipo.ps1\n    .\\info-equipo.ps1 -Exportar &quot;$env:USERPROFILE\\Desktop\\ficha.json&quot;\n#&gt;\n[CmdletBinding()]\nparam(\n    [string]$Exportar\n)\n\n$so      = Get-CimInstance Win32_OperatingSystem\n$equipo  = Get-CimInstance Win32_ComputerSystem\n$bios    = Get-CimInstance Win32_BIOS\n$cpu     = Get-CimInstance Win32_Processor | Select-Object -First 1\n$red     = Get-NetIPConfiguration | Where-Object { $_.NetAdapter.Status -eq &#x27;Up&#x27; -and $_.IPv4Address } | Select-Object -First 1\n$fisicos = Get-PhysicalDisk\n\n$discos = Get-Volume | Where-Object { $_.DriveLetter -and $_.DriveType -eq &#x27;Fixed&#x27; } | ForEach-Object {\n    [pscustomobject]@{\n        Unidad      = &quot;$($_.DriveLetter):&quot;\n        TamanoGB    = [math]::Round($_.Size / 1GB, 1)\n        LibreGB     = [math]::Round($_.SizeRemaining / 1GB, 1)\n        LibrePct    = if ($_.Size) { [math]::Round($_.SizeRemaining / $_.Size * 100) } else { 0 }\n    }\n}\n\n$ficha = [ordered]@{\n    Equipo          = $env:COMPUTERNAME\n    Usuario         = &quot;$env:USERDOMAIN\\$env:USERNAME&quot;\n    Fabricante      = $equipo.Manufacturer\n    Modelo          = $equipo.Model\n    Serie           = $bios.SerialNumber\n    SistemaOperativo= &quot;$($so.Caption) ($($so.Version))&quot;\n    UltimoReinicio  = $so.LastBootUpTime\n    DiasEncendido   = [math]::Round(((Get-Date) - $so.LastBootUpTime).TotalDays, 1)\n    Procesador      = $cpu.Name.Trim()\n    MemoriaGB       = [math]::Round($equipo.TotalPhysicalMemory / 1GB, 1)\n    DiscosFisicos   = ($fisicos | ForEach-Object { &quot;$($_.FriendlyName) [$($_.MediaType), $($_.HealthStatus)]&quot; }) -join &#x27;; &#x27;\n    IP              = $red.IPv4Address.IPAddress\n    PuertaEnlace    = $red.IPv4DefaultGateway.NextHop\n    MAC             = $red.NetAdapter.MacAddress\n}\n\nWrite-Host &quot;`nFicha del equipo&quot; -ForegroundColor Cyan\n[pscustomobject]$ficha | Format-List\n\nWrite-Host &#x27;Volúmenes&#x27; -ForegroundColor Cyan\n$discos | Format-Table -AutoSize\n\n# Avisos útiles para el diagnóstico\nif ($ficha.DiasEncendido -gt 7) {\n    Write-Host &quot;Aviso: el equipo lleva $($ficha.DiasEncendido) días sin reiniciar.&quot; -ForegroundColor Yellow\n}\n$discos | Where-Object LibrePct -lt 15 | ForEach-Object {\n    Write-Host &quot;Aviso: la unidad $($_.Unidad) tiene solo $($_.LibrePct) % libre.&quot; -ForegroundColor Yellow\n}\n$fisicos | Where-Object HealthStatus -ne &#x27;Healthy&#x27; | ForEach-Object {\n    Write-Host &quot;Alerta: el disco $($_.FriendlyName) reporta estado $($_.HealthStatus). Respaldar datos.&quot; -ForegroundColor Red\n}\n\nif ($Exportar) {\n    $salida = [pscustomobject]$ficha\n    $salida | Add-Member -NotePropertyName Volumenes -NotePropertyValue (($discos | ForEach-Object { &quot;$($_.Unidad) $($_.LibreGB)/$($_.TamanoGB) GB&quot; }) -join &#x27;; &#x27;)\n    switch ([IO.Path]::GetExtension($Exportar).ToLower()) {\n        &#x27;.csv&#x27;  { $salida | Export-Csv -Path $Exportar -NoTypeInformation -Encoding UTF8 }\n        default { $salida | ConvertTo-Json | Out-File -FilePath $Exportar -Encoding utf8 }\n    }\n    Write-Host &quot;Ficha exportada a $Exportar&quot; -ForegroundColor Cyan\n}\n<\/code><\/pre>"}, {"id": "limpiar-cola-impresion", "titulo": "limpiar-cola-impresion.ps1", "grupo": "Scripts", "html": "<h1>limpiar-cola-impresion.ps1<\/h1><p>Script de PowerShell. Para ejecutarlo: <code>powershell -ExecutionPolicy Bypass -File .\\scripts\\limpiar-cola-impresion.ps1<\/code><\/p><pre><code>&lt;#\n.SYNOPSIS\n    Limpia la cola de impresión cuando hay trabajos atascados.\n\n.DESCRIPTION\n    Detiene el servicio Spooler, borra los archivos temporales de los trabajos en cola\n    y vuelve a iniciar el servicio. Muestra cuántos trabajos se eliminaron.\n    Equivale a los pasos 2 a 4 de la guía 03.\n\n.EXAMPLE\n    .\\limpiar-cola-impresion.ps1\n\n.NOTES\n    Requiere PowerShell como administrador. Los documentos en cola se pierden: avisar al usuario.\n#&gt;\n#Requires -RunAsAdministrator\n[CmdletBinding(SupportsShouldProcess)]\nparam()\n\n$carpeta = Join-Path $env:SystemRoot &#x27;System32\\spool\\PRINTERS&#x27;\n\n$trabajos = Get-Printer | ForEach-Object { Get-PrintJob -PrinterName $_.Name -ErrorAction SilentlyContinue }\nWrite-Host (&quot;Trabajos en cola antes de limpiar: {0}&quot; -f @($trabajos).Count)\n\nif ($PSCmdlet.ShouldProcess(&#x27;Servicio Spooler&#x27;, &#x27;Detener, limpiar y reiniciar&#x27;)) {\n    Write-Host &#x27;Deteniendo el servicio de Cola de impresión...&#x27;\n    Stop-Service -Name Spooler -Force -ErrorAction Stop\n\n    # Espera a que el servicio libere los archivos.\n    (Get-Service -Name Spooler).WaitForStatus(&#x27;Stopped&#x27;, &#x27;00:00:15&#x27;)\n\n    $archivos = Get-ChildItem -Path $carpeta -File -ErrorAction SilentlyContinue\n    $archivos | Remove-Item -Force -ErrorAction SilentlyContinue\n    Write-Host (&quot;Archivos temporales eliminados: {0}&quot; -f @($archivos).Count)\n\n    Write-Host &#x27;Iniciando el servicio...&#x27;\n    Start-Service -Name Spooler -ErrorAction Stop\n\n    $estado = (Get-Service -Name Spooler).Status\n    if ($estado -eq &#x27;Running&#x27;) {\n        Write-Host &#x27;Cola de impresión limpia y servicio en ejecución. Imprime una página de prueba.&#x27; -ForegroundColor Green\n    } else {\n        Write-Host &quot;El servicio quedó en estado $estado. Revisar el Visor de eventos &gt; PrintService.&quot; -ForegroundColor Red\n    }\n}\n<\/code><\/pre>"}, {"id": "plantilla-guia", "titulo": "Plantilla para nuevas guías", "grupo": "Recursos", "html": "<h1>[Problema tal como lo describe el usuario]<\/h1>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aplica a<\/strong><\/td>\n<td>Sistema operativo, versión, tipo de equipo o aplicación<\/td>\n<\/tr>\n<tr>\n<td><strong>Nivel<\/strong><\/td>\n<td>N1 / N2<\/td>\n<\/tr>\n<tr>\n<td><strong>Tiempo estimado<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Riesgo<\/strong><\/td>\n<td>Bajo / medio / alto, y qué se puede perder<\/td>\n<\/tr>\n<tr>\n<td><strong>Requiere<\/strong><\/td>\n<td>Permisos, herramientas, acceso remoto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Síntoma<\/h2>\n<p>Qué ve el usuario, con el mensaje de error exacto entre comillas.<\/p>\n<h2>Causas más comunes<\/h2>\n<ol>\n<li>La más probable.<\/li>\n<li>...<\/li>\n<\/ol>\n<h2>Diagnóstico<\/h2>\n<div class=\"mermaid\">flowchart TD\n    A[Síntoma] --&gt; B{¿Pregunta que descarta&lt;br/&gt;la causa externa?}\n    B -- Sí --&gt; C[Acción]\n    B -- No --&gt; D[Siguiente pregunta]\n<\/div>\n\n<h2>Solución paso a paso<\/h2>\n<h3>1. Nombre del paso<\/h3>\n<p>Instrucción concreta.<\/p>\n<pre><code class=\"language-cmd\">comando\n<\/code><\/pre>\n<p>Resultado esperado: ...<\/p>\n<blockquote>\n<p>Captura sugerida: <code>capturas/NN-nombre.png<\/code><\/p>\n<\/blockquote>\n<h2>Verificación<\/h2>\n<ul>\n<li class=\"check\"><input type=\"checkbox\"> Prueba que confirma que quedó resuelto.<\/li>\n<li class=\"check\"><input type=\"checkbox\"> El usuario confirma.<\/li>\n<\/ul>\n<h2>Si no se resuelve<\/h2>\n<p>Escalar a [equipo] con:<\/p>\n<ul>\n<li>Dato 1<\/li>\n<li>Dato 2<\/li>\n<\/ul>\n<h2>Nota para el ticket<\/h2>\n<pre><code class=\"language-text\">Síntoma:\nDiagnóstico:\nAcciones:\nResultado:\nEstado:\n<\/code><\/pre>"}];

  const links = document.getElementById("links");
  const contenido = document.getElementById("contenido");
  const nav = document.getElementById("nav");
  const menuBtn = nav.querySelector(".menu-btn");

  let grupo = null;
  for (const p of PAGINAS) {
    if (p.grupo && p.grupo !== grupo) {
      grupo = p.grupo;
      const h = document.createElement("h2");
      h.textContent = grupo;
      links.append(h);
    }
    const a = document.createElement("a");
    a.href = "#" + p.id;
    a.textContent = p.titulo;
    links.append(a);
  }

  if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: "neutral" });

  async function mostrar() {
    const id = decodeURIComponent(location.hash.slice(1)) || "inicio";
    const pagina = PAGINAS.find((p) => p.id === id) || PAGINAS[0];
    contenido.innerHTML = pagina.html;
    document.title = pagina.titulo + " | Guías de soporte técnico";
    links.querySelectorAll("a").forEach((a) =>
      a.setAttribute("aria-current", a.getAttribute("href") === "#" + pagina.id ? "page" : "false"));
    nav.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    if (window.mermaid) {
      try { await mermaid.run({ nodes: contenido.querySelectorAll(".mermaid") }); } catch (e) { console.warn(e); }
    }
  }

  menuBtn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", String(open));
  });

  window.addEventListener("hashchange", mostrar);
  mostrar();
</script>
