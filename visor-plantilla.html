<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías de soporte técnico</title>
<style>
  :root {
    --bg: #f4f5f2; --surface: #fff; --ink: #1d2421; --muted: #5f6b65; --line: #dde2dc;
    --brand: #123a37; --accent: #1f6f63; --code: #f3f5f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 "Segoe UI", system-ui, sans-serif; }
  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 1.25rem 1rem; background: var(--brand); color: #d6e5e0; }
  nav h1 { margin: 0 0 1.25rem; padding: 0 .5rem; color: #fff; font-size: 1.05rem; line-height: 1.3; }
  nav h2 { margin: 1.25rem 0 .35rem; padding: 0 .5rem; color: #8fb3a9; font-size: .8rem; font-weight: 600; }
  nav a { display: block; padding: .45rem .5rem; border-radius: 6px; color: inherit; text-decoration: none; font-size: .9rem; line-height: 1.35; }
  nav a:hover { background: rgb(255 255 255 / .07); }
  nav a[aria-current="page"] { background: rgb(159 224 201 / .16); color: #fff; box-shadow: inset 3px 0 0 #9fe0c9; }
  main { min-width: 0; padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; }
  article { max-width: 860px; margin: 0 auto; padding: clamp(1.25rem, 3vw, 2.5rem); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  article h1 { margin-top: 0; font-size: 1.7rem; line-height: 1.25; }
  article h2 { margin-top: 2rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); font-size: 1.3rem; }
  article h3 { margin-top: 1.5rem; font-size: 1.08rem; }
  a { color: var(--accent); }
  table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .9rem; margin: 1rem 0; }
  th, td { padding: .5rem .75rem; border: 1px solid var(--line); text-align: left; vertical-align: top; }
  /* Las fichas de las guías usan una cabecera vacía: se oculta. */
  thead:has(th:empty:first-child) { display: none; }
  tr:nth-child(2n) td { background: #fafbf9; }
  code { padding: .1em .35em; border-radius: 4px; background: var(--code); font: .88em Consolas, ui-monospace, monospace; }
  pre { overflow-x: auto; padding: 1rem; border-radius: 8px; background: #1d2421; color: #e6efe9; font-size: .85rem; line-height: 1.5; }
  pre code { padding: 0; background: none; color: inherit; }
  blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 4px solid #9fe0c9; background: #f2faf7; color: var(--muted); }
  blockquote p { margin: 0; }
  li.check { list-style: none; margin-left: -1.3rem; }
  .mermaid { margin: 1.25rem 0; padding: 1rem; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfb; text-align: center; overflow-x: auto; }
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; }
    nav .links { display: none; }
    nav.open .links { display: block; }
    .menu-btn { display: block; width: 100%; margin-bottom: .5rem; padding: .6rem; border: 1px solid rgb(255 255 255 / .25); border-radius: 6px; background: none; color: #fff; font: inherit; }
    main { padding: 1rem .75rem 3rem; }
  }
  @media print { nav { display: none; } .layout { display: block; } article { border: 0; } }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Contenido">
    <h1>Guías de soporte técnico</h1>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="links">Ver todas las guías</button>
    <div class="links" id="links"></div>
  </nav>
  <main><article id="contenido"></article></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  const PAGINAS = /*__PAGINAS__*/[];

  const links = document.getElementById("links");
  const contenido = document.getElementById("contenido");
  const nav = document.getElementById("nav");
  const menuBtn = nav.querySelector(".menu-btn");

  let grupo = null;
  for (const p of PAGINAS) {
    if (p.grupo && p.grupo !== grupo) {
      grupo = p.grupo;
      const h = document.createElement("h2");
      h.textContent = grupo;
      links.append(h);
    }
    const a = document.createElement("a");
    a.href = "#" + p.id;
    a.textContent = p.titulo;
    links.append(a);
  }

  if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: "neutral" });

  async function mostrar() {
    const id = decodeURIComponent(location.hash.slice(1)) || "inicio";
    const pagina = PAGINAS.find((p) => p.id === id) || PAGINAS[0];
    contenido.innerHTML = pagina.html;
    document.title = pagina.titulo + " | Guías de soporte técnico";
    links.querySelectorAll("a").forEach((a) =>
      a.setAttribute("aria-current", a.getAttribute("href") === "#" + pagina.id ? "page" : "false"));
    nav.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    if (window.mermaid) {
      try { await mermaid.run({ nodes: contenido.querySelectorAll(".mermaid") }); } catch (e) { console.warn(e); }
    }
  }

  menuBtn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", String(open));
  });

  window.addEventListener("hashchange", mostrar);
  mostrar();
</script>
</body>
</html>
